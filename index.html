    <script>
        const toggleSettings = document.getElementById('toggleSettings');
        const settingsPanel = document.getElementById('settingsPanel');
        const apiUrlInput = document.getElementById('apiUrl');
        const apiTokenInput = document.getElementById('apiToken');
        const modelNameInput = document.getElementById('modelName');
        
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Cargar datos guardados
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('apiUrl')) apiUrlInput.value = localStorage.getItem('apiUrl');
            if (localStorage.getItem('apiToken')) apiTokenInput.value = localStorage.getItem('apiToken');
            if (localStorage.getItem('modelName')) modelNameInput.value = localStorage.getItem('modelName');
        });

        toggleSettings.addEventListener('click', () => {
            settingsPanel.classList.toggle('active');
        });

        function saveSettings() {
            localStorage.setItem('apiUrl', apiUrlInput.value.trim());
            localStorage.setItem('apiToken', apiTokenInput.value.trim());
            localStorage.setItem('modelName', modelNameInput.value.trim());
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.textContent = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        // Función inteligente para extraer el texto de cualquier formato de respuesta de API
        function extractResponseText(result) {
            if (typeof result === 'string') return result;
            if (!result) return 'Respuesta vacía del servidor.';

            // Si viene en campos comunes de texto
            if (typeof result.output === 'string') return result.output;
            if (typeof result.text === 'string') return result.text;
            if (typeof result.response === 'string') return result.response;
            if (typeof result.content === 'string') return result.content;

            // Si viene en formato OpenAI (choices)
            if (result.choices && result.choices[0]) {
                const choice = result.choices[0];
                if (typeof choice.text === 'string') return choice.text;
                if (choice.message) {
                    if (typeof choice.message === 'string') return choice.message;
                    if (typeof choice.message.content === 'string') return choice.message.content;
                }
            }

            // Si es un objeto complejo o anidado, buscamos recursivamente o formateamos limpio
            // Si tiene una propiedad que sea un objeto de texto, intentamos sacarla
            for (let key in result) {
                if (typeof result[key] === 'string' && result[key].length > 2) {
                    return result[key];
                }
            }

            // Como último recurso absoluto, formateamos el JSON de forma legible para que nunca salga [object Object]
            return JSON.stringify(result, null, 2);
        }

        async function handleSend() {
            const text = userInput.value.trim();
            const url = apiUrlInput.value.trim();
            const token = apiTokenInput.value.trim();
            const model = modelNameInput.value.trim() || 'gpt-6-astra';

            if (!text) return;
            if (!url) {
                alert('Por favor configura la URL de la API tocando en "⚙️ Configurar API".');
                settingsPanel.classList.add('active');
                return;
            }

            saveSettings();

            // Mostrar mensaje del usuario en el chat
            appendMessage(text, 'user');
            userInput.value = '';

            // Burbuja temporal de carga
            const loadingMsg = appendMessage('Pensando...', 'assistant');

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(token ? { 'Authorization': `Bearer ${token}` } : {})
                    },
                    body: JSON.stringify({
                        model: model,
                        input: text
                    })
                });

                const contentType = response.headers.get('content-type');
                let result;

                if (contentType && contentType.includes('application/json')) {
                    result = await response.json();
                } else {
                    result = await response.text();
                }

                loadingMsg.textContent = extractResponseText(result);
            } catch (error) {
                loadingMsg.textContent = `Error de conexión: ${error.message}`;
                loadingMsg.classList.add('error');
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        sendBtn.addEventListener('click', handleSend);

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Hub - iPad Pro</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --chat-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --user-bubble: #0284c7;
            --ai-bubble: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--chat-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-color);
        }

        .settings-toggle {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .settings-panel {
            background-color: var(--chat-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .settings-panel.active {
            display: flex;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        input {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-color);
            font-size: 0.9rem;
            width: 100%;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        /* Contenedor del chat */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user {
            background-color: var(--user-bubble);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            background-color: var(--ai-bubble);
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .message.error {
            background-color: #7f1d1d;
            border-color: #991b1b;
            align-self: center;
        }

        /* Barra inferior para escribir */
        .input-bar {
            background-color: var(--chat-bg);
            border-top: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: center;
        }

        .input-wrapper {
            max-width: 900px;
            width: 100%;
            display: flex;
            gap: 10px;
        }

        textarea {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-color);
            font-size: 0.95rem;
            flex: 1;
            resize: none;
            height: 48px;
            max-height: 120px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button.send-btn {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            height: 48px;
        }

        button.send-btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <header>
        <h1>AI Chat Assistant</h1>
        <button class="settings-toggle" id="toggleSettings">⚙️ Configurar API</button>
    </header>

    <!-- Panel de configuración ocultable -->
    <div class="settings-panel" id="settingsPanel">
        <input type="text" id="apiUrl" placeholder="URL del Endpoint (ej: https://api...)">
        <input type="password" id="apiToken" placeholder="Bearer Token / API Key">
        <input type="text" id="modelName" placeholder="Modelo (ej: gpt-6-astra)" value="gpt-6-astra">
    </div>

    <!-- Zona de mensajes -->
    <div class="chat-container" id="chatContainer">
        <div class="message assistant">¡Hola! Escribe un mensaje abajo para comenzar la conversación con tu modelo.</div>
    </div>

    <!-- Caja de texto inferior -->
    <div class="input-bar">
        <div class="input-wrapper">
            <textarea id="userInput" placeholder="Escribe tu mensaje aquí..."></textarea>
            <button class="send-btn" id="sendBtn">Enviar</button>
        </div>
    </div>

    <script>
        const toggleSettings = document.getElementById('toggleSettings');
        const settingsPanel = document.getElementById('settingsPanel');
        const apiUrlInput = document.getElementById('apiUrl');
        const apiTokenInput = document.getElementById('apiToken');
        const modelNameInput = document.getElementById('modelName');
        
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Cargar datos guardados
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('apiUrl')) apiUrlInput.value = localStorage.getItem('apiUrl');
            if (localStorage.getItem('apiToken')) apiTokenInput.value = localStorage.getItem('apiToken');
            if (localStorage.getItem('modelName')) modelNameInput.value = localStorage.getItem('modelName');
        });

        toggleSettings.addEventListener('click', () => {
            settingsPanel.classList.toggle('active');
        });

        function saveSettings() {
            localStorage.setItem('apiUrl', apiUrlInput.value.trim());
            localStorage.setItem('apiToken', apiTokenInput.value.trim());
            localStorage.setItem('modelName', modelNameInput.value.trim());
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.textContent = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        async function handleSend() {
            const text = userInput.value.trim();
            const url = apiUrlInput.value.trim();
            const token = apiTokenInput.value.trim();
            const model = modelNameInput.value.trim() || 'gpt-6-astra';

            if (!text) return;
            if (!url) {
                alert('Por favor configura la URL de la API tocando en "⚙️ Configurar API".');
                settingsPanel.classList.add('active');
                return;
            }

            saveSettings();

            // Mostrar mensaje del usuario en el chat
            appendMessage(text, 'user');
            userInput.value = '';

            // Burbuja temporal de carga
            const loadingMsg = appendMessage('Pensando...', 'assistant');

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(token ? { 'Authorization': `Bearer ${token}` } : {})
                    },
                    body: JSON.stringify({
                        model: model,
                        input: text
                    })
                });

                const result = await response.json();

                // Extraer el texto de respuesta del JSON del servidor de manera inteligente
                let replyText = '';
                if (result.output) {
                    replyText = result.output;
                } else if (result.choices && result.choices[0]) {
                    replyText = result.choices[0].message?.content || result.choices[0].text;
                } else {
                    // Si el formato es distinto, mostramos el JSON completo de forma limpia
                    replyText = JSON.stringify(result, null, 2);
                }

                loadingMsg.textContent = replyText;
            } catch (error) {
                loadingMsg.textContent = `Error de conexión: ${error.message}`;
                loadingMsg.classList.add('error');
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        sendBtn.addEventListener('click', handleSend);

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
</html>
